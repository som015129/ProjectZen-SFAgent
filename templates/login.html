<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProjectZen — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08051a;--purple:#8b5cf6;--purple-lt:#a78bfa;--purple-dk:#6d28d9;
  --pink:#f472b6;--border:rgba(139,92,246,0.25);--text:#f1f5f9;--muted:#64748b;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:
    radial-gradient(ellipse 80% 60% at 20% -10%,rgba(109,40,217,0.22) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 110%,rgba(139,92,246,0.15) 0%,transparent 60%),
    var(--bg);
}
.card{
  width:100%;max-width:400px;padding:40px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:16px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.logo{display:flex;align-items:baseline;gap:2px;justify-content:center;margin-bottom:8px}
.lp{font-size:26px;font-weight:700;color:#fff}
.lz{
  font-family:'DM Serif Display',serif;font-style:italic;font-size:28px;
  background:linear-gradient(135deg,var(--purple-lt),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{text-align:center;font-size:12px;color:var(--muted);margin-bottom:32px;letter-spacing:.05em}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-lt);margin-bottom:8px}
input[type=password]{
  width:100%;padding:12px 16px;border-radius:8px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;
  transition:border-color .2s;
}
input[type=password]:focus{border-color:var(--purple)}
input[type=password]::placeholder{color:var(--muted)}
.error{
  margin-top:10px;padding:10px 14px;border-radius:7px;font-size:13px;
  background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);
  color:#f87171;
}
button{
  margin-top:20px;width:100%;padding:13px;border:none;border-radius:8px;
  background:linear-gradient(135deg,var(--purple-dk),var(--purple));
  color:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
  cursor:pointer;box-shadow:0 4px 14px rgba(109,40,217,0.4);
  transition:opacity .2s,transform .1s;
}
button:hover{opacity:.9;transform:translateY(-1px)}
button:active{transform:translateY(0)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="lp">Project</span><span class="lz">Zen</span></div>
  <div class="subtitle">SAP SuccessFactors Intelligence</div>
  <form method="POST">
    <label for="password">Access Password</label>
    <input type="password" id="password" name="password" placeholder="Enter password" autofocus/>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit">Sign In →</button>
  </form>
</div>
</body>
</html>
